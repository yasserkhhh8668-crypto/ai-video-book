  var p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(V)},ck,u(D));

  try{localStorage.setItem("avp-code",code)}catch(x){}
  window.__AVP_CODE=code;
  document.open();document.write(t);document.close();
}
